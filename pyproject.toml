[project]
name = "clipper"
version = "0.1.0"
description = "Self-hosted long-video to vertical Shorts clipper (transcript-first clip selection)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.4.0",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "typer==0.27.3",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "numpy==2.4.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
# Face-following crop (M3). Without it, clips use a center crop.
reframe = ["mediapipe==1.2.2"]
# Web interface (clipper serve).
web = ["fastapi==0.162.3", "uvicorn==0.54.0"]
# Download a finished stream from a link (Twitch, Kick, ...).
fetch = ["yt-dlp==2026.10.26"]

[project.scripts]
clipper = "clipper.cli:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs ffmpeg with libass and flite"]

[tool.hatch.build.targets.wheel.force-include]
"assets/fonts" = "clipper/assets/fonts"
